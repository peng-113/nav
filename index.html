<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f7f9;
    --surface: #ffffff;
    --surface2: #f0f0f5;
    --border: rgba(0,0,0,0.08);
    --text: #18181c;
    --muted: rgba(24,24,28,0.4);
    --accent: #6355e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  /* header */
  header {
    position: relative;
    z-index: 1;
    padding: 48px 48px 36px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .logo span {
    color: var(--accent);
  }
  .date-time {
    text-align: right;
  }
  #clock {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 36px;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1;
  }
  #date {
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 6px;
  }

  /* search bar */
  .search-wrap {
    position: relative;
    z-index: 1;
    padding: 32px 48px 0;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 0 20px;
    gap: 12px;
    transition: border-color 0.2s;
  }
  .search-box:focus-within {
    border-color: var(--accent);
  }
  .search-icon {
    color: var(--muted);
    font-size: 16px;
    flex-shrink: 0;
  }
  .search-box input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 16px 0;
  }
  .search-box input::placeholder { color: var(--muted); }
  .search-engine {
    display: flex;
    gap: 8px;
  }
  .engine-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .engine-btn.active, .engine-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* main content */
  main {
    position: relative;
    z-index: 1;
    padding: 40px 48px 0;
  }

  /* category section */
  .category {
    margin-bottom: 40px;
  }
  .category-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .cat-pill {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .cat-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* color themes per category */
  .cat-work  .cat-pill { background: rgba(56,139,217,0.12); color: #1a6bb5; }
  .cat-news  .cat-pill { background: rgba(202,158,0,0.13); color: #8a6a00; }
  .cat-video .cat-pill { background: rgba(220,88,36,0.12); color: #b84718; }
  .cat-shop  .cat-pill { background: rgba(34,160,100,0.12); color: #1a7a50; }
  .cat-ai    .cat-pill { background: rgba(120,80,220,0.12); color: #5a30b5; }

  /* card grid */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }

  /* individual card */
  .card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    transition: transform 0.18s, border-color 0.18s, background 0.18s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 14px;
    opacity: 0;
    transition: opacity 0.18s;
  }
  .card:hover { transform: translateY(-3px); background: var(--surface2); }

  .cat-work  .card:hover { border-color: rgba(56,139,217,0.4); }
  .cat-work  .card::after { background: radial-gradient(circle at top left, rgba(56,139,217,0.05), transparent 70%); }
  .cat-news  .card:hover { border-color: rgba(202,158,0,0.4); }
  .cat-news  .card::after { background: radial-gradient(circle at top left, rgba(202,158,0,0.05), transparent 70%); }
  .cat-video .card:hover { border-color: rgba(220,88,36,0.4); }
  .cat-video .card::after { background: radial-gradient(circle at top left, rgba(220,88,36,0.05), transparent 70%); }
  .cat-shop  .card:hover { border-color: rgba(34,160,100,0.4); }
  .cat-shop  .card::after { background: radial-gradient(circle at top left, rgba(34,160,100,0.05), transparent 70%); }
  .cat-ai    .card:hover { border-color: rgba(120,80,220,0.4); }
  .cat-ai    .card::after { background: radial-gradient(circle at top left, rgba(120,80,220,0.05), transparent 70%); }
  .card:hover::after { opacity: 1; }

  .card-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .cat-work  .card-icon { background: rgba(56,139,217,0.10); }
  .cat-news  .card-icon { background: rgba(202,158,0,0.10); }
  .cat-video .card-icon { background: rgba(220,88,36,0.10); }
  .cat-shop  .card-icon { background: rgba(34,160,100,0.10); }
  .cat-ai    .card-icon { background: rgba(120,80,220,0.10); }

  .card-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }
  .card-desc {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
  }

  /* stagger animation on load */
  .card {
    animation: fadeUp 0.4s both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 600px) {
    header { padding: 28px 20px 24px; }
    .search-wrap, main { padding-left: 20px; padding-right: 20px; }
    #clock { font-size: 26px; }
    .logo { font-size: 20px; }
  }
</style>
</head>
<body>

<header>

  </div>

      <button class="engine-btn" data-url="https://www.bing.com/search?q=">Bing</button>

</div>

      </a>
      <a class="card" href="https://calendar.google.com" target="_blank" style="animation-delay:0.1s">
        <div class="card-icon">📅</div>
        <div class="card-name">Google 日历</div>
      </a>
      <a class="card" href="https://mail.google.com" target="_blank" style="animation-delay:0.15s">

      </a>
      <a class="card" href="https://drive.google.com" target="_blank" style="animation-delay:0.2s">
        <div class="card-icon">☁️</div>
        <div class="card-name">Google Drive</div>
      </a>

    <div class="cards">

        <div class="card-icon">🤖</div>

      </a>
      <a class="card" href="https://www.36kr.com" target="_blank" style="animation-delay:0.15s">

      <a class="card" href="https://sspai.com" target="_blank" style="animation-delay:0.2s">

  <!-- 视频/娱乐 -->

    <div class="cards">

  <!-- AI 工具 -->
  <section class="category cat-ai">
    <div class="category-header">

</main>

<script>
  // lunar calendar helper
  const lunarMonths = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','冬月','腊月'];
  const lunarDays = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
  // Simplified lunar calculation based on known new moon offsets
  // Base: 2000-01-06 was lunar new year's first new moon ref
  function getLunar(date) {
    const baseDate = new Date(2000, 0, 6);
    const msPerDay = 86400000;
    const synodicMonth = 29.53058867;
    const diff = (date - baseDate) / msPerDay;
    const monthsElapsed = diff / synodicMonth;
    const monthIndex = Math.floor(monthsElapsed);
    const dayInCycle = diff - monthIndex * synodicMonth;
    const lunarDay = Math.floor(dayInCycle);
    const lunarMonth = ((monthIndex % 12) + 12) % 12;
    return lunarMonths[lunarMonth] + lunarDays[Math.min(lunarDay, 29)];
  }

  function updateTime() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = h + ':' + m;
    const days = ['周日','周一','周二','周三','周四','周五','周六'];
    const lunar = getLunar(now);
    document.getElementById('date').innerHTML =
      now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 ' + days[now.getDay()] +
      ' &nbsp;<span style="opacity:0.6;font-size:11px;">农历 ' + lunar + '</span>';
  }
  updateTime();
  setInterval(updateTime, 10000);

  // search
  let activeEngine = document.querySelector('.engine-btn.active');
  document.querySelectorAll('.engine-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.engine-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeEngine = btn;
    });
  });
  document.getElementById('search-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = e.target.value.trim();
      if (!q) return;
      if (q.match(/^https?:\/\//)) { window.open(q, '_blank'); return; }
      window.open(activeEngine.dataset.url + encodeURIComponent(q), '_blank');
    }
  });
</script>
</body>
</html>
